<title>ド・モルガンの法則（集合版）——(A∪B)の補集合＝Aの補集合∩Bの補集合</title>
<desc>同じ配置の2円ベン図を4パネル。左上は和集合の補集合をグレー、右上は A の補集合を斜線、左下は B の補集合を逆斜線、右下は両方の斜線を重ねて共通部分を見せる。左上と右下が一致する</desc>
