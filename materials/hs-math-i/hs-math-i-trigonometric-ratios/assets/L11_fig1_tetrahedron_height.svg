<title>正四面体の高さ——空間図（垂線 AH）と底面 BCD の平面図（直角三角形 BNH）の2パネル</title>
<desc>左は 1辺 6 の正四面体 ABCD の斜投影図で、頂点 A から底面 BCD に下ろした垂線 AH（破線）とその足 H、BC の中点 N、線分 BH・HN を描く（背面の辺 BD は破線）。右は底面 BCD を真上から見た正三角形で、中心 H・中点 N・線分 BH・HN を入れ、∠BNH の直角マークと ∠HBN=30°、BN=3 をラベルする。BH・AH・体積の値は書かない。同型の図を描くときは、H を底面の正三角形の中心（3つの頂点から等しい距離の点）にとり、AH が鉛直に見える投影を使い、隠れる辺を破線にする</desc>
