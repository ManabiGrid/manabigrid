<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
<title>外接円と正弦定理の導出——直径 BD を引いてできる直角三角形 BCD（鋭角と鈍角の2パネル）</title>
<desc>三角形 ABC の外接円（中心 O・半径 R）に頂点 B を通る直径 BD を引く。左は A が鋭角で、D は直線 BC について A と同じ側にあり、円周角の定理から ∠BDC=A。右は A が鈍角で、D は反対側にあり ∠BDC=180°−A。どちらも直角三角形 BCD で sin ∠BDC=a/(2R) となり、sin A=a/(2R) が成り立つ。同型の図を描くときは、B を通る直径のもう一方の端を D にとることと、∠BCD の直角マークを保つ。</desc>
