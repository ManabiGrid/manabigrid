<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
<title>三角形の面積公式の高さ——A から BC に下ろした垂線 AH=b sin C（鋭角と鈍角の2パネル）</title>
<desc>辺 BC を底辺にとり、頂点 A から直線 BC に垂線 AH を下ろす。左は C が鋭角（a=6・b=5・C=60°）で H は辺 BC 上にあり AH=b sin C=5√3/2。右は C が鈍角（a=4・b=3・C=150°）で H は辺 BC の C 側の延長上にあり、AH=b sin(180°−C)=b sin C=3/2。どちらも S=(1/2)×a×AH=(1/2)ab sin C。同型の図を描くときは、H の位置（内側／延長上）と直角マークを保つ。</desc>
