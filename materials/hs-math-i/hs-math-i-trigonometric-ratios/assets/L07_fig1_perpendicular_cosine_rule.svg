<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350">
<title>垂線と余弦定理の導出——C から AB に下ろした垂線 CH（鋭角と鈍角の2パネル）</title>
<desc>三角形 ABC で頂点 C から直線 AB に垂線 CH を下ろす。左は A が鋭角で、H が辺 AB 上にあり、AH=b cos A・CH=b sin A・BH=c−b cos A。右は A が鈍角で、H が辺 BA を A の側に延長した直線上にあり、AH=b cos(180°−A)・CH=b sin A・BH=c＋AH。どちらも直角三角形 BCH で a²=CH²＋BH² となり、整理すると a²=b²＋c²−2bc cos A。同型の図を描くときは、H の位置（内側／延長上）と直角マークを保つ。</desc>
