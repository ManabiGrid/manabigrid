<title>夏の模式天気図（北が上）——日本の南から南東の海上に張り出す高気圧（中心1016hPa）と大陸側の低気圧（中心1000hPa）</title>
<desc>北が上の模式天気図（教材用に作成・架空の値）。日本の南から南東の海上に、東西に長い楕円の等圧線（1012・1008）をもつ高気圧（中心1016hPa）が張り出し、大陸側に低気圧（中心1000hPa・1004の線）がある。高気圧の中心は地点ア（日本の町）から見てほぼ東（やや南）、低気圧の中心はほぼ西（やや北）。等圧線は4hPaごとで、冬の図より間隔が広い。地点イは高気圧の中心付近の海上。風向の矢印と季節の名前は図に入れない。同型図は2つの中心の向きと距離・楕円の半径を差し替えて生成する</desc>
