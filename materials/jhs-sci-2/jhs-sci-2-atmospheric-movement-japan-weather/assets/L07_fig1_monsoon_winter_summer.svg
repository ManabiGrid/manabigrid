<title>冬と夏の大陸と海洋の温度差・気圧配置・地表付近の風の向き（2パネル）</title>
<desc>左のパネル「冬」と右のパネル「夏」の模式図（教材用に作成）。各パネルの左の四角が大陸、右の四角が海洋で、中に温度のようす（大陸と海洋をくらべた「冷たい」「暖かい」）と地表付近の気圧の高低（「高」「低」）を書き、下の矢印で地表付近の風の向き（高から低へ）を示した。冬は大陸が冷たい・高、海洋が暖かい・低で大陸→海洋、夏はその逆。8方位・数値は書かない。同型図は季節ごとの温度の語を差し替えて生成する（高低と矢印は「冷たい側が高」から決まる）</desc>
