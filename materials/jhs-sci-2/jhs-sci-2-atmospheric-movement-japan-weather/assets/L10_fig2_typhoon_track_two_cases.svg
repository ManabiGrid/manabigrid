<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352">
<title>台風の進路と高気圧の張り出しの模式図（2パネル）——高気圧の張り出し（大きさと位置）を変えて進路のちがいを見せる</title>
<desc>北が上の模式図2枚（教材用に作成）。パネルAでは高気圧の楕円が大きく西へ張り出して日本の南の海上をおおい、台風の進路の曲線は南の海上から西寄りに進んで高気圧の西の縁を回り、日本の西側を北上する。パネルBでは高気圧の楕円が小さく東へ退き、進路は高気圧の西の縁を回って日本の近くまで北上し、北東へ向きを変える。どちらのパネルが夏・秋かは書かない。数値なし。日本列島と大陸は簡略な多角形。同型図は高気圧の楕円の中心・半径と進路の制御点を差し替えて生成する</desc>
<!-- L10_fig2_typhoon_track_two_cases.svg | 台風の進路と高気圧の張り出しの模式図（2パネル）——高気圧の張り出し（大きさと位置）を変えて進路のちがいを見せる -->
