<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>高気圧と低気圧のまわりの風の吹き方（北半球・上空から見た模式図）</title>
<desc>北が上・上空から見た模式図（教材用に作成）。左に高気圧、右に低気圧を置き、それぞれ2本の円形の等圧線と、外側の円の東・北・西・南の地点に風の矢印をかいた。矢印は等圧線にそう向きと中心へ向かう（高気圧では中心から離れる）向きのちょうど中間（45°）で、低気圧へは反時計回りに吹きこみ、高気圧からは時計回りに吹き出す。地点ア〜エは低気圧のまわり、カ〜ケは高気圧のまわり。風向の文字は図に入れない。同型図は地点の数と位置を差し替えて生成する</desc>
