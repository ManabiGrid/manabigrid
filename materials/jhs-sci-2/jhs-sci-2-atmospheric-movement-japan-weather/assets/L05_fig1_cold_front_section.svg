<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>寒冷前線の断面模式図——西の寒気が東の暖気の下にもぐりこみ、急な前線面に沿って背の高い雲</title>
<desc>地面を横から見た断面の模式図（教材用に作成・左が西、右が東、前線は東へ進む）。左の寒気（網かけ）が右の暖気の下にもぐりこみ、前線面の傾きは急（傾き（縦/横）=2.4。描くための値で、実際の傾きではない）。前線付近の狭い範囲に楕円を重ねた背の高い雲がある。地点Aは前線の東側、地点Bは西側の地表。同型図は前線面の傾きと雲の形を差し替えて生成する</desc>
