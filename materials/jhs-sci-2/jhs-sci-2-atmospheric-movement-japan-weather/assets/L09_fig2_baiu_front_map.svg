<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484">
<title>梅雨の模式天気図（北が上）——日本列島にそって東西にのびる前線と、北と南の海上の高気圧（どちらも中心1016hPa）</title>
<desc>北が上の模式天気図（教材用に作成・架空の値）。日本列島にそって東西にのびる前線に、半円（線の北側）と三角（線の南側）の記号を交互につけた。前線の北の海上と南の海上に高気圧（どちらも中心1016hPa・4hPaごとの閉じた等圧線2本）がある。地点アは前線の北側、イは前線の南側、ウは前線のすぐ近く。気団の名前と季節の名前は図に入れない。日本列島と大陸は簡略な多角形。同型図は前線の制御点と2つの高気圧の位置・値を差し替えて生成する</desc>
