<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410">
<title>模式天気図——西に高気圧（中心1024hPa）、東に低気圧（中心996hPa）、4hPaごとの等圧線と地点ア〜エ</title>
<desc>北が上の模式天気図（教材用に作成・架空の値）。西に高気圧（中心1024hPa）、東に低気圧（中心996hPa）があり、それぞれのまわりに4hPaごとの閉じた等圧線（相似な楕円）を3本ずつ引いた。数字は1020・1012・1004の線にだけ書き、地点ア〜エは等圧線の上に置いた（地点の横に気圧値は書かない）。同型図は中心の値・線の本数・地点ののる線を差し替えて生成する</desc>
