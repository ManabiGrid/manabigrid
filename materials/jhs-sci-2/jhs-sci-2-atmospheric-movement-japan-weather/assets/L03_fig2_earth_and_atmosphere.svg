<title>地球と大気の層の厚さのイメージ図（正確な縮尺ではない）</title>
<desc>大きな円（地球）のまわりに大気の層をごく細い環（半径の2.5%。描くための値で、実際の比率ではない）でかいたイメージ図（教材用に作成）。厚さの数値を読み取る図ではなく、大気の層が地球の大きさにくらべてごく薄いことだけを伝える。同型図は環の厚さ（半径に対する割合）を差し替えて生成する</desc>
