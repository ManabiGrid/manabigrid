<title>温帯低気圧と2つの前線の平面模式図（北が上・上空から見た図）</title>
<desc>北が上・上空から見た模式図（教材用に作成）。低気圧の中心（×）から東側へ半円の記号の前線、南西側へ三角の記号の前線がのび、半円は線の北側から北東側に、三角は線の南東側についている。中心の東・南・西・北の地点に、レッスン2の約束どおり反時計回りに吹きこむ風の矢印（中心へ向かう向きから45°）をかいた。地点アは中心の東で、半円の前線の北東側、イは2つの前線の間、ウは三角の前線の西側。風向の文字と前線の名前は図に入れない。同型図は前線の制御点と地点の位置を差し替えて生成する</desc>
