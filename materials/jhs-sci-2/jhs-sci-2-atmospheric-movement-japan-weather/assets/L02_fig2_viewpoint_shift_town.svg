<title>低気圧の中心が町の南にあるときの町の位置と風の矢印（答えは「？」）</title>
<desc>北が上・上空から見た模式図（教材用に作成）。低気圧の中心とそのまわりの円形の等圧線2本をかき、中心の真北（中心が町の南）の等圧線上に町（人形マーク）を置いた。町の地点に、レッスン2の約束どおり反時計回りに吹きこむ風の矢印（中心へ向かう向きから45°）をかき、町の風向は「？」とした。同型図は町を置く側（東・北・西・南）を差し替えて生成する</desc>
