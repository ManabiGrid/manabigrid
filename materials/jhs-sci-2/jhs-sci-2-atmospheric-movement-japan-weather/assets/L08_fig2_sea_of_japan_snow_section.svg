<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
<title>日本海側の雪の断面模式図——日本海の上で水蒸気を受け取り、山の日本海側で雲・雪、山を越えた太平洋側は晴れ</title>
<desc>左が日本海、中央が日本の山、右が太平洋側の断面の模式図（教材用に作成・山の高さや雲の大きさは誇張）。地表付近の風の矢印が左から右へ進み、日本海の上で「水蒸気を受け取る」を、山の日本海側の斜面の上に楕円を重ねた雲と「雲・雪」を、山を越えた太平洋側に「晴れ」を書いた。同型図は地形の折れ線と雲の位置を差し替えて生成する</desc>
