<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>温暖前線の断面模式図——西の暖気が東の寒気の上にゆるやかにはい上がり、ゆるい前線面に沿って広い範囲の雲</title>
<desc>地面を横から見た断面の模式図（教材用に作成・左が西、右が東、前線は東へ進む）。左の暖気が右の寒気（網かけ）の上にゆるやかにはい上がり、前線面の傾きはゆるい（傾き（縦/横）=0.3。描くための値で、実際の傾きではない）。前線面の上に沿って、前線の東側の広い範囲に平たい雲が広がる。地点Cは前線の東側（雲の下）、地点Dは西側の地表。同型図は前線面の傾きと雲の並びを差し替えて生成する</desc>
