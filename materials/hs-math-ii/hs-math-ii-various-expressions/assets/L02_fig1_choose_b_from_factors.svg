<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398">
<title>(a＋b)⁴ の a²b² の項——4つのかっこのうち b を選ぶ2つの組は6通り</title>
<desc>上に番号1〜4をつけた4つのかっこ (a＋b)。その下に、b を選ぶ2つのかっこに網かけと太字の b を置き、残りの2つには a を置いた行を 1と2・1と3・1と4・2と3・2と4・3と4 の順に6行並べ、各行の右に積 a²b² を書く。右の括弧で6行をまとめて 6通り、下に a²b² の係数は 4C2=6。同型図はかっこの個数と選ぶ個数を差し替えて生成する</desc>
