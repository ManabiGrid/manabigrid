<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356">
<title>判別式と放物線——D&gt;0 は2点で交わり、D=0 は1点で接し、D&lt;0 は共有点をもたない</title>
<desc>同じ目盛りの座標平面を3つ横に並べ、y=x²−2x−3・y=x²−2x＋1・y=x²−2x＋3 を描く（本文の表の c=−3, 1, 3）。左は D&gt;0 で x 軸と x=−1, 3 の2点で交わる、中央は D=0 で x=1 の1点で接する、右は D&lt;0 で頂点 (1, 2) が x 軸より上。数学Ⅰ「二次関数」の3態の図と同じ描き方。同型図は c の値を差し替えて生成する</desc>
