<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428">
<title>恒等式と方程式——y=(x＋1)² と y=x²＋2x＋1 は重なり、y=x²−x と y=2 は2点でだけ交わる</title>
<desc>2つの座標平面を横に並べる。左は y=(x＋1)²（太いグレーの線）と y=x²＋2x＋1（黒い破線）で、2本が同じ放物線の上に重なる。右は y=x²−x と y=2 で、交点 (−1, 2)・(2, 2) に点を打ち、x 軸へ破線を下ろして −1 と 2 を書く。同型図は左の2つの式（展開の前と後）と、右の2つの式を差し替えて生成する</desc>
