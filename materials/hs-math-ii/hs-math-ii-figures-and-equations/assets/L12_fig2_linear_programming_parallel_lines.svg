<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478">
<title>線形計画法——製品 A を x 個・B を y 個作る条件の領域と、平行に動かした3本の直線 2000x＋1000y=P（最大は頂点 (120, 40) で P=280000）</title>
<desc>4点 (0, 0)、(400/3, 0)、(120, 40)、(0, 100) を頂点とする四角形（x≧0・y≧0・x＋2y≦200・3x＋y≦400 の共通部分）を灰色で塗り、境界の直線 x＋2y=200・3x＋y=400 を実線で描く。直線 2000x＋1000y=P を P の値を変えて3本、破線で平行に描く（いちばん上は頂点 (120, 40) を通る P=280000 の直線）。(120, 40) に大きい●。設定と数値は高等学校学習指導要領解説 数学編（平成30年告示）の線形計画法の例（本文の例題4に出典を併記）。1目盛りは縦横とも同じ長さ。同型図は条件の係数と利益の係数を差し替えて生成する（頂点は連立方程式で計算）</desc>
