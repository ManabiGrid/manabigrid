<title>距離の比が一定（比は正で 1:1 でない）の点の軌跡は円——A(−2, 0)、B(1, 0) で AP:BP=2:1 なら中心 (2, 0)・半径 2、1:2 なら中心 (−3, 0)・半径 2</title>
<desc>2つのパネルに同じ2点 A(−2, 0)、B(1, 0) をとり、左に AP:BP=2:1 の点の軌跡（中心 (2, 0)、半径 2 の円）、右に AP:BP=1:2 の点の軌跡（中心 (−3, 0)、半径 2 の円）を描く。各円の上の1点 P から A と B へ破線を引き、比の条件を満たす点の例を示す。円は近い方の点の側にできる。1目盛りは縦横とも同じ長さで、2つのパネルは同じ縮尺。同型図は比を差し替えて生成する（中心と半径は式で計算）</desc>
