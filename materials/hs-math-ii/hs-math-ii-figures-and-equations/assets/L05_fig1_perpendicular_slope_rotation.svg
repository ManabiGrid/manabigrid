<title>垂直条件を直角三角形の回転で見る——横1・縦 m の直角三角形を原点のまわりに 90° 回すと、横 m・縦 1 になる</title>
<desc>原点 O を通る傾き m の直線と、横1・縦 m の直角三角形 OAP（P(1, m)）をうすい網かけで描き、それを原点のまわりに左回りに 90° 回した直角三角形（頂点 Q(−m, 1)）を濃い網かけで重ねる。直線 OQ も窓の端まで描き、O で OP と OQ が垂直であることを直角の印で示す。P から Q へ 90° の弧の矢印。本文の m₁ を図では m と書く。文字だけの図（傾きの値も積の値も書かない）。同型図は描く値 m を差し替えて生成する</desc>
