<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345">
<title>円を境界線とする領域——(x−1)²＋(y−2)²&lt;9 は破線の円の内部、x²＋y²≧4 は実線の円の外部</title>
<desc>2つのパネルに、左は不等式 (x−1)²＋(y−2)²&lt;9 の表す領域（中心 (1, 2)・半径 3 の円を破線で描き、内部に斜線）、右は不等式 x²＋y²≧4 の表す領域（半径 2 の円を実線で描き、窓の中の外部に斜線）を描く。左は代入した中心 (1, 2) に●。下に境界線を含むかどうかを書く。1目盛りは縦横とも同じ長さ。同型図は中心・半径と不等号を差し替えて生成する</desc>
