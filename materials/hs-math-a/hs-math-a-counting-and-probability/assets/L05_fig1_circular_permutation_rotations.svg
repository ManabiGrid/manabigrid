<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270">
<title>円順列——A を上の席に固定した配置と、それを1席ずつ回転した4つの配置は同じ座り方</title>
<desc>5つの席を円周上に等間隔に置いた円卓を5つ並べ、上の席から時計回りに ABCDE・BCDEA・CDEAB・DEABC・EABCD と読める配置を描く。どれも各人の右隣が同じなので同じ座り方。同型図は人数（列の文字列）を差し替えて生成する</desc>
