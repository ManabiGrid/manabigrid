<title>ルーレットの円板を中心角 30°・90°・120°・120° の扇形に分け、面積比から確率 1/12・1/4・1/3・1/3</title>
<desc>半径 140 の円を上から時計回りに 1等 30°・2等 90°・3等 120°・はずれ 120° の扇形に分け（白・斜線・うすい灰・濃い灰）、各扇形の外側に名と中心角、確率を書く。右に 確率＝中心角／360°。賞金・期待値は書かない。同型図は賞の名と中心角を差し替えて生成する（確率は自動計算・和 1 を assert）</desc>
