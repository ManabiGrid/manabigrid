<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
<title>格子点と直線 3x＋5y=1——整数解 (−3, 2)・(2, −1)・(7, −4)・(12, −7) が等間隔に並ぶ</title>
