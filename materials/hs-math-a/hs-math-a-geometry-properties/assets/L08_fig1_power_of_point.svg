<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330">
<title>方べきの定理の3つの形——(i) P が内部（2弦の交点）・(ii) P が外部（2本の割線）・(iii) P が外部で一方が接線</title>
<desc>半径 1.6 の同じ円を3パネルに描く。(i) 内部の点 P=(0.45,0.3) を通る2本の弦 AB・CD。(ii) 外部の点 P=(−3.4,0) から2本の割線を引き、近い順に A・B と C・D。(iii) 同じ P から割線 PAB と接線 PT（接点 T は OP を直径とする円との交点）。長さの数値は書かない。同型図は P と直線の向きを差し替えて生成する</desc>
