<title>立方体の1つの角を、その頂点から出る3辺の途中を通る平面で切り落とした立体（切り口は網かけの三角形）</title>
<desc>1辺 1 の立方体の手前・右・上の頂点を、3辺上の t=0.45 の点を通る平面で切り落とす。残る7頂点と新しい3頂点から面を支持平面探索で求め（三角形 1・四角形 3・五角形 3）、可視面に接する辺を実線・それ以外を破線で描く。切り口を網かけし「切り口」とだけ書く（v・e・f の値は書かない）。同型図は t と切る頂点を差し替えて生成する</desc>
