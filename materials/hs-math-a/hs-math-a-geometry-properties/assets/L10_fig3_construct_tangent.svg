<title>円外の点 P からの接線の作図——OP を直径とする円（破線）と円 O の交点 Q・Q′ が接点、接線は PQ・PQ′ の2本</title>
<desc>半径 1.8 の円 O と外部の点 P=(5,0)。OP の中点 M を中心とし OP を直径とする円を破線でかき、円 O との交点 Q（上）・Q′（下）をとる。PQ・PQ′ が接線で、Q・Q′ に直角マーク。数値は書かない。同型図は半径と P の位置を差し替えて生成する</desc>
