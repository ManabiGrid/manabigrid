<title>四角形が円に内接する条件（逆）の証明図——3点 A・B・D を通る円と、直線 BD について C と同じ側の円周上の点 C′</title>
<desc>∠A＋∠C=180° の四角形 ABCD（実線）に対し、3点 A・B・D を通る円を細線でかき、対角線 BD を破線で引く。円周上で直線 BD について C と同じ側に C′ をとり、BC′・DC′ を破線で結ぶ。∠BCD と ∠BC′D に同じ1重の弧、∠A に2重の弧。数値は書かない。同型図は5点の角度位置を差し替えて生成する</desc>
