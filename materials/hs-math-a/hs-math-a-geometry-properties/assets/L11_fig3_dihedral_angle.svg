<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<title>2平面のなす角——交線 ℓ 上の点 O から α 上に ℓ⊥m、β 上に ℓ⊥n を引いたときの m と n のなす角（左: 一般・右: 90° で α⊥β）</title>
<desc>水平な平面 α（網かけ）と、交線 ℓ（太線）を共有して傾いた平面 β を斜投影で描く。O から α 上に ℓ に垂直な m、β 上に ℓ に垂直な n を引き、左パネルは m・n の間に弧（傾き 60°）、右パネルは直角マーク（傾き 90°・α⊥β）。角度の数値は書かない。同型図は β の傾きを差し替えて生成する</desc>
