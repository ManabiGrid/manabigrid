<title>共通接線の長さ——左: 共通外接線（O′ から OA に垂線 O′H・OH=r−r′）、右: 共通内接線（O′B の延長へ O から垂線 OH・O′H=r＋r′）</title>
<desc>半径 r=2 の円 O と半径 r′=1.2 の円 O′（中心間 5）。左パネルは共通外接線 AB と、O′ から OA へ下ろした垂線の足 H（直角三角形 OO′H）。右パネルは共通内接線 AB と、O′B を B の側に延長した直線へ O から下ろした垂線の足 H（長方形 OABH）。半径に r・r′ のラベル。長さの数値は書かない。同型図は r・r′・d を差し替えて生成する</desc>
