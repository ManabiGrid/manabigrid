<title>外心 O——△ABC の3辺の垂直二等分線が1点で交わり、O を中心に3頂点を通る円（外接円）がかける</title>
<desc>鋭角三角形 ABC（B 左下・C 右下・A 上）に、3辺の垂直二等分線を破線で引く（中点に直角マーク・等しい2区間に辺ごとのティック 1・2・3 本）。3本は1点 O で交わり、O を中心とし OA を半径とする円が A・B・C を通る。数値は書かない。同型図は3頂点の座標を差し替えて生成する（鈍角にすると O は外部に出る）</desc>
