<title>3心の比較——一般の三角形では外心 O・内心 I・重心 G が別の点、正三角形では1点に重なる（2パネル）</title>
<desc>左パネルは一般の三角形 ABC に外心 O・内心 I・重心 G を別々の点として置き、外接円と内接円を破線で添える。右パネルは正三角形 ABC で3点が1点（O=I=G）に重なる。数値は書かない。同型図は左の頂点座標を差し替えて生成する（二等辺にすると3点が対称軸上に並ぶ）</desc>
