<title>星形七角形——円周上の7点 A₁〜A₇ を1つおきに結んだ図（先端 A₁ の角に弧）</title>
<desc>半径 3 の円周上に A₁（真上）から反時計回りに等間隔で7点をとり、A₁→A₃→A₅→A₇→A₂→A₄→A₆→A₁ と結ぶ。先端 A₁ の角に1重の弧を付ける。角の値・和は書かない。同型図は点の数 n と結ぶ間隔 step を差し替えて生成する（2つおきなら step=3）</desc>
