<title>内心 I——△ABC の3つの内角の二等分線が1点で交わり、I を中心に3辺に接する円（内接円）がかける</title>
<desc>△ABC（B 左下・C 右下・A 上）に3つの内角の二等分線を破線で引き（各頂点の2つの半角に同じ本数の弧——A は3重・B は2重・C は1重）、交点 I から3辺へ下ろした垂線（直角マーク）を細線で描く。I を中心とし、垂線の長さを半径とする円が3辺に接する。数値は書かない。同型図は3頂点の座標を差し替えて生成する</desc>
