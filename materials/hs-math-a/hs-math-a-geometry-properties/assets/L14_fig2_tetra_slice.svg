<title>三角錐 PABC（PA⊥平面 ABC・∠BAC=90°・AB=6・AC=3・PA=4）と、切り出した平面 ABC 上の図（外接円・二等分線 AD・その延長と円の交点 E）</title>
<desc>左: A を原点、AB を x 軸、AC を奥行き、PA を高さにとった三角錐を斜投影で描き（可視面 PAB に接する辺 AB・PA・PB は実線、隠れた辺 AC・BC・PC は破線）、底面の3点を通る円を破線、AD を細線、DE・PD を破線で添える（A に2つの直角マーク）。右: 平面 ABC を描き直した図——直角三角形 ABC とその外接円（中心は BC の中点）、∠A の二等分線 AD（2つの半角に弧）、延長と円の交点 E、BE・CE を破線。与件 6・3・4 だけを書く。同型図は AB・AC・PA を差し替えて生成する</desc>
