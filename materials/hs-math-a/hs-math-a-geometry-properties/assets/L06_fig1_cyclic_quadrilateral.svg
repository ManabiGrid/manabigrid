<title>円に内接する四角形 ABCD——対角 ∠A と ∠C（和が 180°）と、辺 BC の延長上の点 E がつくる外角 ∠DCE（＝∠A）</title>
<desc>中心 O の円に四角形 ABCD を反時計回りに内接させ（A 左上・B 左下・C 右下・D 右上）、∠A に1重の弧、∠C に2重の弧を付ける。辺 BC を C の側に延長した破線上の点 E をとり、外角 ∠DCE に ∠A と同じ1重の弧を付ける。角度の数値は書かない。同型図は4点の角度位置を差し替えて生成する</desc>
